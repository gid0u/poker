[project]
name = "poker-evaluator"
version = "0.1.0"
description = "Poker evaluation and recorded-video research studio"
readme = "README.md"
authors = [
    { name = "儀同三司", email = "yuk.beryllium@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
media = ["opencv-python>=4.10", "Pillow>=10"]

[project.scripts]
poker-studio = "poker_evaluator.gui:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.161.0",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
